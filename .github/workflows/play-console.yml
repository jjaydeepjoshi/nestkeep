name: Deploy to Play Console

# Manual only. versionCode is the run number, so every run uploads a new, unique build.
#
# One linear pipeline: tests + lint -> build and publish to internal -> promote to closed
# testing (alpha) -> promote to production. `deploy_up_to` controls how far a run goes and
# defaults to closed_testing, so a plain run can never reach production by accident.
# Later stages promote the SAME uploaded versionCode forward; they never rebuild.
on:
  workflow_dispatch:
    inputs:
      deploy_up_to:
        description: "How far this run should go"
        required: true
        default: closed_testing
        type: choice
        options:
          - internal
          - closed_testing
          - production
      release_status:
        description: "Release status for every track this run touches (use draft until the Play listing is complete)"
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed

concurrency:
  group: play-console
  cancel-in-progress: false

jobs:
  checks:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Unit tests, lint and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

  deploy_internal:
    name: Build and deploy to Internal
    needs: checks
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Write Play publisher service account key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_PUBLISHER_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$SERVICE_ACCOUNT_JSON" || { echo "Missing PLAY_PUBLISHER_SERVICE_ACCOUNT_JSON secret"; exit 1; }
          printf '%s' "$SERVICE_ACCOUNT_JSON" > play-publisher-key.json

      - name: Build release bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Publish to Internal
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew publishBundle
          --track internal
          --release-status ${{ inputs.release_status }}
          --stacktrace

      - name: Clean up secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" play-publisher-key.json app/google-services.json

      - name: Upload bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

  firestore_rules:
    name: Deploy Firestore rules
    needs: checks
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}

      - name: Deploy rules
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" npx --yes firebase-tools@latest deploy --only firestore --project nestkeep-rentals-app --non-interactive
          rm -f "$RUNNER_TEMP/firebase-sa.json"

  promote_closed_testing:
    name: Promote to Closed Testing
    if: inputs.deploy_up_to == 'closed_testing' || inputs.deploy_up_to == 'production'
    needs: deploy_internal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Write google-services.json (needed to configure the build)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Write Play publisher service account key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_PUBLISHER_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$SERVICE_ACCOUNT_JSON" > play-publisher-key.json

      - name: Promote Internal -> Closed testing (alpha)
        run: >
          ./gradlew promoteReleaseArtifact
          --from-track internal
          --promote-track alpha
          --release-status ${{ inputs.release_status }}
          --stacktrace

      - name: Clean up secrets
        if: always()
        run: rm -f play-publisher-key.json app/google-services.json

  promote_production:
    name: Promote to Production
    if: inputs.deploy_up_to == 'production'
    needs: promote_closed_testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Write google-services.json (needed to configure the build)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Write Play publisher service account key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_PUBLISHER_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$SERVICE_ACCOUNT_JSON" > play-publisher-key.json

      - name: Promote Closed testing (alpha) -> Production
        run: >
          ./gradlew promoteReleaseArtifact
          --from-track alpha
          --promote-track production
          --release-status ${{ inputs.release_status }}
          --stacktrace

      - name: Clean up secrets
        if: always()
        run: rm -f play-publisher-key.json app/google-services.json
