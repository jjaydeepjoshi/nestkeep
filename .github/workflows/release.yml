name: Release to Google Play

# Every push to main builds a signed bundle and publishes it to the chosen Play track.
# Default track is "alpha" (closed testing). Run manually to pick internal/alpha or a draft release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      track:
        description: Play track (internal = internal testing, alpha = closed testing)
        type: choice
        options: [alpha, internal]
        default: alpha
      status:
        description: Release status (use draft until the Play listing is complete)
        type: choice
        options: [completed, draft]
        default: completed

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON" || { echo "Missing GOOGLE_SERVICES_JSON secret"; exit 1; }
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 secret"; exit 1; }
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build signed bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintRelease bundleRelease assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: nestkeep-${{ env.VERSION_NAME }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Deploy Firestore security rules
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" npx --yes firebase-tools@latest deploy --only firestore --project nestkeep-rentals-app --non-interactive

      - name: Check Play credentials
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set; bundle built but not uploaded to Play."; fi

      - name: Upload to Google Play
        if: steps.play.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nestkeep.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'alpha' }}
          status: ${{ inputs.status || vars.PLAY_RELEASE_STATUS || 'draft' }}
          mappingFile: app/build/outputs/mapping/release/mapping.txt
